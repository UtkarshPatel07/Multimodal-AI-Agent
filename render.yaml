services:
  # Backend API Service
  - type: web
    name: multimodal-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python app.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ANTHROPIC_API_KEY
        sync: false
    healthCheckPath: /health

  # Frontend Service
  - type: web
    name: multimodal-ai-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run preview -- --host 0.0.0.0 --port $PORT"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: multimodal-ai-backend
          envVarKey: RENDER_EXTERNAL_URL
